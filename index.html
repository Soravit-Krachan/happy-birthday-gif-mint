<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กดที่ลิ้งค์ได้เย้ย🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--fg:#3d2b1f;--muted:#8a6a55;--card:#ffffff;--accent:#ff8a3d;--accent2:#ffc83d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--fg:#fff1e0;--muted:#d9b99c;--card:#2e231a;--accent:#ff9d57;--accent2:#ffd35e}}
:root[data-theme="dark"]{--bg:#1d1610;--fg:#fff1e0;--muted:#d9b99c;--card:#2e231a;--accent:#ff9d57;--accent2:#ffd35e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Mali","Sarabun",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:var(--bg);transition:opacity .6s,visibility .6s}
#gate.hide{opacity:0;visibility:hidden}
#gate h2{margin:0}
.gift{font-size:96px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
button{font:inherit;border:0;border-radius:999px;padding:14px 32px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(255,138,61,.35);cursor:pointer}
button:active{transform:scale(.96)}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px}
.hero{text-align:center;padding:24px 0}
.hero h1{margin:8px 0;font-size:34px;line-height:1.25;color:var(--accent)}
.hero .name{font-size:26px;font-weight:700}
.msg{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.08);white-space:pre-line}
h2.sec{font-size:20px;margin:36px 0 12px}
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 10px;margin:0 -20px}
.ph{flex:0 0 80%;scroll-snap-align:center;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.1)}
.ph .img{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(160deg,#ffe0bf,#fff0b8)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.ph p{margin:0;padding:12px 14px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.cards{display:grid;gap:12px}
.cards div{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.end{text-align:center;margin-top:40px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<section id="gate">
  <div class="gift">🎁</div>
  <h2>มีของขวัญให้มิ้นด้วย</h2>
  <button id="open">แตะดูสิ</button>
</section>
<main>
  <div class="hero">
    <div style="font-size:48px">🎂</div>
    <h1>สุขสันต์วันเกิดนะ</h1>
    <div class="name" id="name"></div>
  </div>
  <div class="msg" id="msg"></div>
  <h2 class="sec">📸 รูปตั้งใจเลือกมากกก</h2>
  <div class="gal" id="gal"></div>
  <p class="hint">ปัดไปทางซ้ายเพื่อดูรูปต่อไป →</p>
  <h2 class="sec">🎉 อ่านด้วย</h2>
  <div class="cards" id="cards"></div>
  <div class="end"><button id="again">กดอีกที 🎉</button><p class="hint">ขอให้เป็นวันที่ดีมากๆอีกวันฮะ (ยิ้มอยู่อะเด้)</p></div>
</main>

];
const REASONS = ["มีโอกาสไว้ไปเที่ยวด้วยกันอีกหลายๆที่นะ","และไม่ว่ามิ้นจะทำอะไรเค้าเป็นกำลังใจให้นะสู้ๆ"];
// ============================
document.getElementById("name").textContent = NAME;
document.getElementById("msg").textContent = MESSAGE;
const gal = document.getElementById("gal");
PHOTOS.forEach(p => {
  const d = document.createElement("div"); d.className = "ph";
  const box = document.createElement("div"); box.className = "img";
  if (p.src) { const im = document.createElement("img"); im.src = p.src; im.alt = ""; box.appendChild(im); } else { box.textContent = "🖼️"; }
  const cap = document.createElement("p"); cap.textContent = p.cap || "";
  d.append(box, cap); gal.appendChild(d);
});
const cards = document.getElementById("cards");
REASONS.forEach(r => { const d = document.createElement("div"); d.textContent = r; cards.appendChild(d); });

const cv = document.getElementById("cf"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function fit(){cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio}
addEventListener("resize", fit); fit();
function boom(){
  const cols = ["#ff8a3d","#ffc83d","#ff5c8a","#6bcbff","#b28dff"];
  for (let i = 0; i < 140; i++) parts.push({x:cv.width/2,y:cv.height*0.45,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(Math.random()*-14-4)*devicePixelRatio,s:(Math.random()*6+4)*devicePixelRatio,c:cols[i%5],r:Math.random()*6,l:1});
  cancelAnimationFrame(raf); tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => {p.x+=p.vx;p.y+=p.vy;p.vy+=.35*devicePixelRatio;p.r+=.2;p.l-=.008;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts = parts.filter(p => p.l > 0);
  if (parts.length) raf = requestAnimationFrame(tick); else cx.clearRect(0,0,cv.width,cv.height);
}
document.getElementById("open").onclick = () => {document.getElementById("gate").classList.add("hide"); boom()};
document.getElementById("again").onclick = boom;
</script>
